version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'pr: dependencies'
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-deps:
        dependency-type: development
        exclude-patterns:
          - 'stylelint'
          - 'stylelint-config-standard'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - 'pr: dependencies'
    groups:
      stylelint-actions:
        patterns: ['stylelint/.github/*']
    cooldown:
      exclude: ['stylelint/.github/*']
